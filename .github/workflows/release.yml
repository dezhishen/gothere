name: Release

# 推送 v* tag 即发布：单二进制（每个平台各构建一次）、单文件 CLI、单文件游戏，外加校验和。
# 也可以在 Actions 页面手动触发，并指定已有的 tag。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（形如 v0.2.0），必须与 package.json 的版本一致
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: 校验与打包
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tag 必须等于 package.json 的版本
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          want="v$(node -p "require('./package.json').version")"
          echo "tag=$tag · package=$want"
          test "$tag" = "$want"

      - name: Test
        run: pnpm test

      - name: Layer gate
        run: node scripts/check-layers.mjs

      - name: Build single-file game and CLI
        run: pnpm build

      - name: Upload platform-independent artifacts
        uses: actions/upload-artifact@v5
        with:
          name: bundle
          if-no-files-found: error
          path: |
            dist/gothere-play.html
            dist/gothere-cli.mjs
            dist/gothere-cli.cjs

  binary:
    name: 单二进制 ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary: gothere-linux-x64
          - os: macos-14
            target: darwin-arm64
            binary: gothere-darwin-arm64
          - os: windows-latest
            target: win32-x64
            binary: gothere-win32-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SEA 用当前 node 本体做底，不能交叉编译；构建脚本自己会在空目录里跑一遍
      # --version / level list / level simulate 才算成功。
      - name: Build single binary
        run: node scripts/build-binary.mjs

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: binary-${{ matrix.target }}
          if-no-files-found: error
          path: dist/${{ matrix.binary }}

  publish:
    name: 发布到 Release
    needs: [verify, binary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          ls -l
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: gothere ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
