name: Release

# 推送 v* tag 即发布：单二进制（每个平台各构建一次）、单文件 CLI、单文件游戏，外加校验和。
# 也可以在 Actions 页面手动触发，并指定已有的 tag。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（形如 v0.1.0），必须与 package.json 的版本一致
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: 校验与打包
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tag 必须等于 package.json 的版本
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          want="v$(node -p "require('./package.json').version")"
          echo "tag=$tag · package=$want"
          test "$tag" = "$want"

      - name: Test
        run: pnpm test

      - name: Layer gate
        run: node scripts/check-layers.mjs

      - name: Build single-file game and CLI
        run: pnpm build

      - name: Build agent skill package (node flavor)
        run: node scripts/build-skill.mjs

      # 统一摊平到 release/ 再上传：artifact 会保留相对路径，
      # 直接传 dist/… 与 skills/… 会在发布侧变成目录，校验和那一步就会炸。
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/gothere-play.html dist/gothere-cli.mjs dist/gothere-cli.cjs release/
          cp dist/gothere-agent-node.* release/
          # SKILL.md 不单独发布：它只作为 Agent 技能包的一员存在。
          ls -l release

      - name: Upload platform-independent artifacts
        uses: actions/upload-artifact@v5
        with:
          name: bundle
          if-no-files-found: error
          path: release/*

  targets:
    name: 制品 ${{ matrix.target }}
    needs: verify
    # 一台 ubuntu 就能产出全部平台的制品：
    # - 单二进制：与平台无关的 SEA blob + 目标平台的官方 node 本体（postject 注入）
    # - 桌面端：@electron/packager 下载目标平台的 Electron 再组装
    # - macOS：注入会让签名失效，用 rcodesign 在本机做 ad-hoc 签名
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64, win32-x64, darwin-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build binary, agent package and desktop client
        run: node scripts/build-release.mjs --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/gothere-${{ matrix.target }} release/ 2>/dev/null || true
          cp dist/gothere-${{ matrix.target }}.exe release/ 2>/dev/null || true
          cp dist/gothere-agent-${{ matrix.target }}.* release/
          cp dist/gothere-desktop-${{ matrix.target }}.* release/
          ls -l release

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: release/*

  publish:
    name: 发布到 Release
    needs: [verify, targets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find . -type f ! -name SHA256SUMS.txt | sort | xargs -r sha256sum > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: gothere ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
